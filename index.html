<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO1 · Inicio</title>
<meta name="theme-color" content="#1e293b">
<style>
/* Enlaces de cada app: es lo único que cambia entre asambleas */
:root{--navy:#1e293b;--navy2:#0f172a;--green:#22c55e;--bg:#eef2f7;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}
header{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:36px 20px 70px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(34,197,94,.35)}
h1{margin-top:14px;font-size:30px;font-weight:900;letter-spacing:-.02em}
header p{margin-top:6px;color:#cbd5e1;font-size:15px}
main{max-width:860px;margin:-44px auto 0;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
a.card{display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:20px;text-decoration:none;color:inherit;
  box-shadow:0 10px 30px rgba(15,23,42,.08);border:2px solid transparent;transition:transform .12s,border-color .12s}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--green);outline:none}
.ic{flex:0 0 56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.t{font-size:19px;font-weight:800}
.d{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.35}
.who{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.arrow{margin-left:auto;color:#cbd5e1;flex:0 0 auto}
.sec{margin:26px 4px 10px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
  </div>
  <h1 id="nombre">SO1</h1>
  <p>¿A dónde quieres entrar?</p>
</header>
<main>
  <div class="grid" id="apps"></div>
  <footer id="pie"></footer>
</main>
<script>
/* ═══ CONFIGURACIÓN DE LA ASAMBLEA ═══ */
var ASAMBLEA = {
  nombre: 'SO1',
  apps: { puntajes: 'puntajes/', lista: 'lista/', admin: 'admin/', tesoreria: 'tesoreria/' }
};

var ICON = {
  puntajes: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  lista: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/>',
  admin: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h3M8 17h6"/>',
  tesoreria: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>'
};
var APPS = [
  {k:'puntajes',  t:'Consultar mi puntaje', d:'Revisa tu puntaje, ranking e historial con tu RUT', who:'Socios', c:'#22c55e', s:'#dcfce7', wc:'#15803d'},
  {k:'lista',     t:'Pasar lista',          d:'Marca la asistencia en reuniones y marchas',       who:'Directiva y comisiones', c:'#8b5cf6', s:'#ede9fe', wc:'#6d28d9'},
  {k:'admin',     t:'Administración',       d:'Socios, eventos, puntajes, ausencias y accesos',   who:'Directiva', c:'#3b82f6', s:'#dbeafe', wc:'#1d4ed8'},
  {k:'tesoreria', t:'Tesorería',            d:'Cuotas, pagos, ingresos y gastos',                 who:'Tesorería', c:'#f59e0b', s:'#fef3c7', wc:'#b45309'}
];

document.getElementById('nombre').textContent = ASAMBLEA.nombre;
document.title = ASAMBLEA.nombre + ' · Inicio';
document.getElementById('pie').textContent = ASAMBLEA.nombre + ' · Gestión de socios';
document.getElementById('apps').innerHTML = APPS.filter(function(a){ return ASAMBLEA.apps[a.k]; }).map(function(a){
  return '<a class="card" href="' + ASAMBLEA.apps[a.k] + '">' +
    '<div class="ic" style="background:' + a.s + '"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="' + a.c + '" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' + ICON[a.k] + '</svg></div>' +
    '<div><div class="t">' + a.t + '</div><div class="d">' + a.d + '</div>' +
    '<span class="who" style="background:' + a.s + ';color:' + a.wc + '">' + a.who + '</span></div>' +
    '<svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>' +
  '</a>';
}).join('');
</script>
</body>
</html>
